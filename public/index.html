<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Auction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen" class="login-panel">
        <h1>Enter Draft</h1>
        <input type="text" id="username" placeholder="Your Name">
        <button id="join-btn">Join Auction</button>
    </div>

    <div id="main-screen" class="hidden">
        <div id="user-stats"></div>
        <div class="panel">
            <h2 id="status-msg">Waiting for others...</h2>
            <div id="nomination-zone" class="hidden">
                <input type="text" id="item-name" placeholder="Horse Name">
                <select id="item-category">
                    <option value="" disabled selected>-- Select Category --</option>
                    <option value="Colt">Colt</option>
                    <option value="Filly">Filly</option>
                </select>
                <button onclick="nominate()">Nominate Horse</button>
            </div>
            <div id="bid-zone" class="hidden">
                <p>Bidding on: <strong id="current-item"></strong></p>
                <input type="number" id="bid-amount" placeholder="Your Bid">
                <button onclick="submitBid()">Submit Secret Bid</button>
            </div>
        </div>
        <div id="log"><strong>Auction History</strong><hr></div>
        <div class="panel">
            <h3>Selected Names</h3>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody id="selected-names-body">
                    <!-- Names will be populated here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

</body>
</html>
